name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_TAG: 0.1.0

jobs:
  api-lint:
    name: API · lint y tipos
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src tests alembic scripts

  api-test:
    name: API · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e ".[dev]"
      # La suite necesita un Postgres primario y su réplica en streaming:
      # los tests de comparativa, de estado de búsqueda y de métricas
      # escriben en el primario y leen por la réplica (conftest.esperar_replica).
      - name: Levantar Postgres (primario + réplica) y Redis
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_REPLICATION_PASSWORD: testpass
        run: |
          docker compose -f ../infra/docker-compose.base.yml -f ../infra/docker-compose.dev.yml \
            up -d --wait postgres-primary postgres-replica redis
      - name: Aplicar el esquema
        env:
          DATABASE_URL_RW: postgresql+asyncpg://app:testpass@localhost:5432/precios
        run: alembic upgrade head
      - name: Tests
        env:
          DATABASE_URL_RW: postgresql+asyncpg://app:testpass@localhost:5432/precios
          DATABASE_URL_RO: postgresql+asyncpg://app:testpass@localhost:5433/precios
          REDIS_URL: redis://localhost:6379/0
          NEXTAUTH_SECRET: secreto-de-prueba-para-la-ci-32-bytes
        run: pytest --cov=src/dominio --cov=src/aplicacion --cov-report=term-missing
      - name: Cobertura mínima del dominio
        env:
          DATABASE_URL_RW: postgresql+asyncpg://app:testpass@localhost:5432/precios
          DATABASE_URL_RO: postgresql+asyncpg://app:testpass@localhost:5433/precios
          REDIS_URL: redis://localhost:6379/0
          NEXTAUTH_SECRET: secreto-de-prueba-para-la-ci-32-bytes
        run: pytest --cov=src/dominio --cov-fail-under=80 --cov-report=term-missing

  web-lint:
    name: Web · lint y tipos
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run lint:i18n
      - run: npm run lint:a11y

  web-test:
    name: Web · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  security:
    name: Seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: zricethezav/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir las imágenes
        run: |
          docker build -f api/Dockerfile -t comparador-precios-api:ci api
          docker build -f web/Dockerfile -t comparador-precios-web:ci web
      - name: Trivy sobre la imagen de la API
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: comparador-precios-api:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
      - name: Trivy sobre la imagen de la web
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: comparador-precios-web:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore

  compose-validate:
    name: Compose · configuración
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar base + dev
        run: docker compose -f infra/docker-compose.base.yml -f infra/docker-compose.dev.yml config > /dev/null
      - name: Validar base + prod
        run: docker compose -f infra/docker-compose.base.yml -f infra/docker-compose.prod.yml config > /dev/null
