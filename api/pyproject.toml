[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "comparador-precios-api"
version = "0.1.0"
description = "API del comparador de precios de supermercados"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "redis>=5.2,<7.0",
  "alembic>=1.14,<2.0",
  "pyjwt>=2.10,<3.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<2.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.8,<1.0",
]

# El código se ejecuta desde /app/src, no se instala como paquete.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Un único event loop por sesión: los engines cacheados de la API se crean en
# el loop del proceso (como en producción) y no en uno distinto por test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
