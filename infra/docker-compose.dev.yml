# Entorno de desarrollo: hot-reload, puertos expuestos y logs verbosos.
x-dev-environment: &dev-environment
  APP_ENV: dev
  LOG_LEVEL: DEBUG

services:
  postgres-primary:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  postgres-replica:
    ports:
      - "${POSTGRES_REPLICA_PORT:-5433}:5432"

  api:
    command:
      [
        "uvicorn",
        "src.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/src",
      ]
    environment:
      <<: *dev-environment
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ../api/src:/app/src
      - ../api/tests:/app/tests
      - ../api/alembic:/app/alembic

  worker:
    environment:
      <<: *dev-environment
    volumes:
      - ../api/src:/app/src

  scheduler:
    environment:
      <<: *dev-environment
    volumes:
      - ../api/src:/app/src

  web:
    command: ["npm", "run", "dev"]
    environment:
      <<: *dev-environment
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ../web/src:/app/src
      - ../web/public:/app/public
      - /app/node_modules
      - /app/.next

  caddy:
    environment:
      <<: *dev-environment
    ports:
      - "${HTTP_PORT:-80}:80"
