# Plantilla de secretos: NO contiene valores reales.
# Copia a `secret.yaml`, rellena los valores y no lo subas al repositorio.
#
#   kubectl -n comparador-precios create secret generic comparador-precios-secret \
#     --from-literal=DATABASE_URL_RW='postgresql+asyncpg://...' \
#     --from-literal=REDIS_URL='redis://...' \
#     --from-literal=NEXTAUTH_SECRET='...' \
#     --from-literal=GOOGLE_CLIENT_ID='...' \
#     --from-literal=GOOGLE_CLIENT_SECRET='...' \
#     --from-literal=MICROSOFT_CLIENT_ID='...' \
#     --from-literal=MICROSOFT_CLIENT_SECRET='...' \
#     --from-literal=LLM_API_KEY='...'
apiVersion: v1
kind: Secret
metadata:
  name: comparador-precios-secret
  namespace: comparador-precios
  labels:
    app.kubernetes.io/part-of: comparador-precios
type: Opaque
stringData:
  APP_SECRET_KEY: ""
  DATABASE_URL_RW: ""
  DATABASE_URL_RO: ""
  REDIS_URL: ""
  NEXTAUTH_SECRET: ""
  SESSION_TTL_SEGUNDOS: "2592000"
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  MICROSOFT_CLIENT_ID: ""
  MICROSOFT_CLIENT_SECRET: ""
  MICROSOFT_TENANT_ID: "common"
  LLM_PROVIDER: ""
  LLM_API_KEY: ""
  LLM_MODEL: ""
  SENTRY_DSN: ""
