apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: comparador-precios
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: comparador-precios
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: comparador-precios
    spec:
      containers:
        - name: worker
          image: ghcr.io/tu-usuario/comparador-precios-api:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.worker"]
          envFrom:
            - configMapRef:
                name: comparador-precios-config
            - secretRef:
                name: comparador-precios-secret
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
