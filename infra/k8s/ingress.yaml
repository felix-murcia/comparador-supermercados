apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: comparador-precios
  namespace: comparador-precios
  labels:
    app.kubernetes.io/part-of: comparador-precios
  annotations:
    # Redirige todo el tráfico a la web; /api lo enruta la web a la API.
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - precios.ejemplo.com
      secretName: comparador-precios-tls
  rules:
    - host: precios.ejemplo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
