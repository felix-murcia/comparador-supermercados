apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: comparador-precios
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: comparador-precios
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: comparador-precios
    spec:
      containers:
        - name: api
          image: ghcr.io/tu-usuario/comparador-precios-api:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: comparador-precios-config
            - secretRef:
                name: comparador-precios-secret
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: comparador-precios
  labels:
    app.kubernetes.io/name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http
