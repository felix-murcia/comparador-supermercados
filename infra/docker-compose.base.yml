name: comparador-precios

# Configuración común de los procesos Python (api, worker, scheduler).
# Comparten imagen y variables; solo cambia el comando de arranque.
x-api-common: &api-common
  build:
    context: ../api
    dockerfile: Dockerfile
    target: runtime
  image: comparador-precios-api:${IMAGE_TAG:-0.1.0}
  env_file:
    - path: ../.env
      required: false
  environment:
    APP_ENV: ${APP_ENV:-dev}
    PYTHONUNBUFFERED: "1"
  restart: unless-stopped
  networks:
    - backend

services:
  postgres-primary:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-precios}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-}
    volumes:
      - pg_primary:/var/lib/postgresql/data
      - ./postgres/init-primary.sh:/docker-entrypoint-initdb.d/10-init-primary.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - backend

  postgres-replica:
    image: postgres:16-alpine
    user: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-precios}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-}
      PRIMARY_HOST: postgres-primary
      PRIMARY_PORT: "5432"
    volumes:
      - pg_replica:/var/lib/postgresql/data
      - ./postgres/init-replica.sh:/usr/local/bin/init-replica.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/init-replica.sh"]
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  backup:
    image: postgres:16-alpine
    entrypoint: ["/bin/bash", "-c"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-precios}
      BACKUP_DIR: /backups
      RETENCION_DIAS: ${BACKUP_RETENCION_DIAS:-7}
    volumes:
      - pg_backups:/backups
      - ./postgres/backup.sh:/usr/local/bin/backup.sh:ro
    command:
      - |
        while true; do
          /usr/local/bin/backup.sh || echo "El backup falló; se reintentará mañana"
          sleep 86400
        done
    depends_on:
      postgres-primary:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  api:
    <<: *api-common
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - backend
      - frontend
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *api-common
    command: ["python", "-m", "src.worker"]
    healthcheck:
      disable: true
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    <<: *api-common
    command: ["python", "-m", "src.scheduler"]
    healthcheck:
      disable: true
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      target: runner
    image: comparador-precios-web:${IMAGE_TAG:-0.1.0}
    environment:
      APP_ENV: ${APP_ENV:-dev}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: ${APP_BASE_URL:-http://localhost:8000}
      NEXTAUTH_URL: ${WEB_BASE_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      SESSION_TTL_SEGUNDOS: ${SESSION_TTL_SEGUNDOS:-2592000}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_APP_ENV: ${APP_ENV:-dev}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend

  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    image: comparador-precios-caddy:${IMAGE_TAG:-0.1.0}
    environment:
      APP_ENV: ${APP_ENV:-dev}
      CADDY_SITE_ADDRESS: ":80"
      RATE_LIMIT_BUSQUEDAS_POR_MINUTO: ${RATE_LIMIT_BUSQUEDAS_POR_MINUTO:-10}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped
    networks:
      - frontend

volumes:
  pg_primary:
  pg_replica:
  pg_backups:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  backend:
  frontend:
